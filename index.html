<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | Affiliate Hub AI</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; cursor: pointer; color: #667eea; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Tu correo">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="mainBtn" onclick="login()">Entrar</button>
        <div class="link" onclick="toggleMode()" id="toggleText">¿No tenés cuenta? Registrate</div>
    </div>

    <script>
        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Iniciar Sesión" : "Registrarse";
            document.getElementById('mainBtn').innerText = isLogin ? "Entrar" : "Crear Cuenta";
            document.getElementById('toggleText').innerText = isLogin ? "¿No tenés cuenta? Registrate" : "¿Ya tenés cuenta? Ingresá";
        }

        async function login() {
            const endpoint = isLogin ? '/api/login' : '/api/register';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (data.success) {
                alert("Bienvenido");
                window.location.href = "/dashboard.html";
            } else {
                alert("Error: " + data.message);
            }
        }
    </script>
</body>
</html>
